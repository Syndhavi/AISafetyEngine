<!DOCTYPE html>
<html>
<head>
    <title>Safety Setup</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            width: 250px;
            padding: 15px;
            background: #f5f5f5;
        }

        h3 {
            text-align: center;
        }

        label {
            font-size: 13px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 8px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #45a049;
        }

        #status {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
        }
    </style>
</head>

<body>

<h3>🛡 Safety Setup</h3>

<label>Your Email</label>
<input id="userEmail" type="email" placeholder="you@example.com" />

<label>Guardian Email</label>
<input id="guardianEmail" type="email" placeholder="guardian@example.com" />

<button id="saveBtn">Save</button>

<div id="status"></div>

<script src="popup.js"></script>

</body>
</html>
